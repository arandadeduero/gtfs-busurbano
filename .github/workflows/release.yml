name: Create GTFS Release

on:
  push:
    branches:
      - main
    paths:
      - "*.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Create GTFS zip
        run: |
          zip latest.zip *.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: Release ${{ steps.date.outputs.date }} (#${{ github.run_number }})
          body: |
            GTFS feed actualizado automáticamente
            Fecha: ${{ steps.date.outputs.date }}
          files: |
            latest.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
